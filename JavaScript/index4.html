<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link rel="stylesheet" href="style4.css">
</head>
<body>
<div class="card iPhone">
    <div class="card-image">
        <img src="image/phone.png" width="250">
    </div>
    <div class="card-info">
        <h3>Apple iPhone 15, черный</h3>
        <div class="size">
            <h5>Объем <br> памяти</h5>
            <button class="btn-size medium active">
                256
            </button>
            <button class="btn-size large">
                512
            </button>
        </div>
        <div class="counter">
            <button id="minus"> - </button>
            <h3 id="value"> 1 </h3>
            <button id="plus"> + </button>
            <h3 class="price">1500$</h3>
        </div>
        <div class="price-block">
            <button id="buy"> Купить </button>
        </div>
    </div>
</div>
<div class="card iPhone">
    <div class="card-image">
        <img src="image/phone1.jpg" width="250">
    </div>
    <div class="card-info">
        <h3>Apple iPhone 15, черный</h3>
        <div class="size1">
            <h5>Объем <br> памяти</h5>
            <button class="btn-size medium1 active">
                256
            </button>
            <button class="btn-size large1">
                512
            </button>
        </div>
        <div class="counter">
            <button id="minus1"> - </button>
            <h3 id="value1"> 1 </h3>
            <button id="plus1"> + </button>
            <h3 class="price1">1500$</h3>
        </div>
        <div class="price-block">
            <button id="buy1"> Купить </button>
        </div>
    </div>
</div>
<script src="script4.js"></script>
</body>
</html>
